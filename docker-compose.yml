services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aguas
      POSTGRES_PASSWORD: aguas_dev
      POSTGRES_DB: aguas_purificadas
    ports:
      - "5432:5432"
    volumes:
      - aguas_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aguas -d aguas_purificadas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aguas_pg_data:
