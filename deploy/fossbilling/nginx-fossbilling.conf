# FOSSBilling vhost for billing.mibidon.cl (+ admin.mibidon.cl alias).
# Based on https://docs.fossbilling.org/getting-started/installation/ (NGINX).
# Exact server_names win over the *.mibidon.cl wildcard in sites-available/mibidon,
# so tenant stores keep going to Next.js. TLS mirrors the mibidon vhost: Cloudflare
# proxied in front, origin uses the *.mibidon.cl cert in /etc/nginx/ssl.

server {
    listen 80;
    listen [::]:80;
    server_name billing.mibidon.cl admin.mibidon.cl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name billing.mibidon.cl admin.mibidon.cl;

    ssl_certificate     /etc/nginx/ssl/mibidon.crt;
    ssl_certificate_key /etc/nginx/ssl/mibidon.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    root /var/www/fossbilling;
    index index.php;
    sendfile off;
    include /etc/nginx/mime.types;
    client_max_body_size 20m;

    access_log /var/log/nginx/fossbilling.access.log;
    error_log  /var/log/nginx/fossbilling.error.log;

    try_files $uri $uri/ /index.php$is_args$args;

    location ~* \.(ini|sh|inc|bak|twig|sql|conf|lock|log|old|ya?ml|htaccess|htpasswd)$ {
        return 403;
    }

    location ^~ /vendor/ {
        return 403;
    }

    location ~* ^/themes/[^/]+/config/ {
        return 403;
    }

    location ~ /\.(?!well-known\/) {
        return 403;
    }

    location ^~ /data/ {
        return 403;
    }

    location ~ ^/(index\.php|ipn\.php|install/index\.php|install/install\.php)$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_intercept_errors on;
        include fastcgi_params;
        # Cloudflare terminates TLS; the origin hop is also HTTPS.
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    location ~* \.php$ {
        return 403;
    }
}
