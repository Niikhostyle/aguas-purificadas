# MiBidón PRIMARY — default_server on 80/443.
# veotv.cloud stays in its own site file (no default_server).
# App listens on 127.0.0.1:3001.

map $http_x_forwarded_proto $mibidon_proto {
    default $scheme;
    https https;
    http http;
}

upstream mibidon_app {
    # Same backend twice so proxy_next_upstream can retry once during a container swap.
    server 127.0.0.1:3001 max_fails=0;
    server 127.0.0.1:3001 max_fails=0;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mibidon.cl www.mibidon.cl *.mibidon.cl _;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 20m;

    error_page 502 503 504 /__mibidon_502.html;
    location = /__mibidon_502.html {
        internal;
        root /var/www/mibidon-errors;
        try_files /502.html =502;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://mibidon_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mibidon_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        include snippets/mibidon-proxy-resilience.conf;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name mibidon.cl www.mibidon.cl *.mibidon.cl _;

    ssl_certificate     /etc/nginx/ssl/mibidon.crt;
    ssl_certificate_key /etc/nginx/ssl/mibidon.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 20m;

    error_page 502 503 504 /__mibidon_502.html;
    location = /__mibidon_502.html {
        internal;
        root /var/www/mibidon-errors;
        try_files /502.html =502;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://mibidon_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mibidon_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        include snippets/mibidon-proxy-resilience.conf;
    }
}
