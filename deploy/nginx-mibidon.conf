# Install on host when nginx already serves other sites (e.g. veotv):
#   cp deploy/nginx-mibidon.conf /etc/nginx/sites-available/mibidon
#   ln -sf /etc/nginx/sites-available/mibidon /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# App listens on 127.0.0.1:3001 by default (3000 reserved for other sites).

server {
    listen 80;
    listen [::]:80;
    server_name mibidon.cl www.mibidon.cl *.mibidon.cl;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
